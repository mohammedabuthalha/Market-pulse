<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Market Pulse" />
  <title>My Market Pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-size='54'>📈</text></svg>" />
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #22c55e;
      --up-bg: rgba(34, 197, 94, 0.14);
      --down: #ef4444;
      --down-bg: rgba(239, 68, 68, 0.14);
      --gold: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.4;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }

    button.refresh-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.refresh-btn:active { opacity: 0.7; }

    .updated {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 18px 0 8px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-title { font-size: 1rem; font-weight: 600; }
    .card-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

    .value-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .value { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
    }
    .badge.up { color: var(--up); background: var(--up-bg); }
    .badge.down { color: var(--down); background: var(--down-bg); }

    .spark { width: 84px; height: 42px; flex-shrink: 0; }

    .notice {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.35);
      color: #fde047;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .history-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      text-align: right;
    }
    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <header>
    <h1>My Market Pulse</h1>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </header>
  <div class="updated" id="updatedText">Loading latest data…</div>
  <div id="noticeBox" class="notice" style="display:none;"></div>
  <main id="app"></main>

  <script>
    const CACHE_KEY = "market_pulse_cache_v1";
    const fmtIN = (n) => new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    const fmtUS = (n) => new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

    function sparklineSvg(values, color) {
      if (!values || values.length < 2) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const w = 84, h = 42, pad = 3;
      const pts = values.map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" fill="none">
        <polyline points="${pts}" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>`;
    }

    function makeCard({ title, sub, valText, chg, color, series }) {
      const isUp = chg >= 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="card-title"></div>
          <div class="card-sub"></div>
          <div class="value-row">
            <span class="value"></span>
            <span class="badge ${isUp ? "up" : "down"}">${isUp ? "+" : ""}${chg.toFixed(2)}%</span>
          </div>
        </div>
        ${sparklineSvg(series, color)}
      `;
      card.querySelector(".card-title").textContent = title;
      card.querySelector(".card-sub").textContent = sub;
      card.querySelector(".value").textContent = valText;
      return card;
    }

    function render(data) {
      const app = document.getElementById("app");
      const latest = data.latest;
      const history = data.history || [];
      document.getElementById("updatedText").textContent = `Last updated: ${data.updated_at_ist || "—"}`;

      app.innerHTML = "";

      const h1 = document.createElement("div");
      h1.className = "section-title";
      h1.textContent = "Bullion (22 Karat / 1 Gram)";
      app.appendChild(h1);

      app.appendChild(makeCard({
        title: "India 22K Gold (1g)",
        sub: `Source: ${latest.in_gold_source || "IBJA"}`,
        valText: `₹${fmtIN(latest.in_gold_22k_1g)}`,
        chg: Number(latest.in_gold_change_pct || 0),
        color: "#eab308",
        series: history.map(d => d.in_gold_22k_1g).filter(Boolean)
      }));

      app.appendChild(makeCard({
        title: "US 22K Gold (1g)",
        sub: "Spot-derived (22/24 of 1g)",
        valText: `$${fmtUS(latest.us_gold_22k_1g)}`,
        chg: Number(latest.us_gold_change_pct || 0),
        color: "#f59e0b",
        series: history.map(d => d.us_gold_22k_1g).filter(Boolean)
      }));

      const h2 = document.createElement("div");
      h2.className = "section-title";
      h2.textContent = "Indian Indices (Daily Close)";
      app.appendChild(h2);

      app.appendChild(makeCard({
        title: "Nifty 50",
        sub: `Close date: ${latest.nifty50_trade_date}`,
        valText: fmtIN(latest.nifty50),
        chg: Number(latest.nifty50_change_pct || 0),
        color: "#14b8a6",
        series: history.map(d => d.nifty50).filter(Boolean)
      }));

      app.appendChild(makeCard({
        title: "BSE Sensex",
        sub: `Close date: ${latest.sensex_trade_date}`,
        valText: fmtIN(latest.sensex),
        chg: Number(latest.sensex_change_pct || 0),
        color: "#6366f1",
        series: history.map(d => d.sensex).filter(Boolean)
      }));

      if (history.length > 0) {
        const h3 = document.createElement("div");
        h3.className = "section-title";
        h3.textContent = "Recent Daily History";
        app.appendChild(h3);

        const wrap = document.createElement("div");
        wrap.className = "history-wrap";
        const rows = [...history].reverse().slice(0, 14).map(r => `
          <tr>
            <td>${r.date}</td>
            <td>₹${fmtIN(r.in_gold_22k_1g)}</td>
            <td>$${fmtUS(r.us_gold_22k_1g)}</td>
            <td>${fmtIN(r.nifty50)}</td>
            <td>${fmtIN(r.sensex)}</td>
          </tr>
        `).join("");
        wrap.innerHTML = `
          <table>
            <thead>
              <tr><th>Date</th><th>IN 22K</th><th>US 22K</th><th>Nifty</th><th>Sensex</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
        app.appendChild(wrap);
      }
    }

    async function loadData() {
      const notice = document.getElementById("noticeBox");
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try { render(JSON.parse(cached)); } catch {}
      }

      try {
        const res = await fetch(`./daily_rates.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        notice.style.display = "none";
        render(data);
      } catch (err) {
        notice.style.display = "block";
        notice.textContent = cached
          ? "Showing cached data (could not reach latest update)."
          : "No daily_rates.json found yet. Run the GitHub Action once in your repo's Actions tab.";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadData);
    loadData();
  </script>
</body>
</html>
